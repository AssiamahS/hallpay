name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:

jobs:
  build:
    # Xcode 27 runner image (GA 2026-10-15). Apps only fill the iPhone Duo
    # inner display when built with the iOS 27.1 SDK.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 27.x
        run: |
          ls -d /Applications/Xcode*.app || true
          # newest stable 27.x; skip betas / release candidates
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE "beta|release_candidate|_rc" | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version

      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned, simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project HallPay.xcodeproj \
            -scheme HallPay \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*HallPay|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
